<!DOCTYPE html>
<html>
<head>
    <title>Opening Skedulo App...</title>
    <meta http-equiv="refresh" content="0;url=skedulox://agenda">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3eef9;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(75,46,131,0.12);
            border-top: 6px solid #4B2E83;
        }

        h1 {
            color: #4B2E83;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 2rem;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #E7DFF6;
            border-top: 4px solid #4B2E83;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .message {
            color: #5f6b76;
            font-size: 1.2rem;
            line-height: 1.4;
            margin: 25px 0;
        }

        .open-btn {
            display: inline-block;
            background: #4B2E83;
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: bold;
            margin: 10px 0 20px 0;
            box-shadow: 0 6px 14px rgba(75,46,131,0.22);
        }

        .open-btn:hover {
            background: #3E246D;
        }

        .tagline {
            color: #666;
            font-size: 0.95rem;
            margin-top: 5px;
        }

        .teams-warning {
            display: none;
            background: #f5f0ff;
            border: 1px solid #d7c8f5;
            border-radius: 12px;
            padding: 15px;
            margin: 20px 0;
            color: #4B2E83;
            line-height: 1.4;
        }

        .arrow-pointer {
            position: fixed;
            top: 20px;
            right: 25px;
            font-size: 40px;
            animation: bounce 1.5s infinite;
            z-index: 9999;
        }

        @keyframes bounce {
            0%,20%,50%,80%,100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        @media (max-width: 480px) {
            .container {
                padding: 40px 25px;
                border-radius: 20px;
            }

            h1 {
                font-size: 1.65rem;
            }

            .message {
                font-size: 1.05rem;
            }

            .arrow-pointer {
                top: 14px;
                right: 18px;
                font-size: 36px;
            }
        }
    </style>
</head>
<body>

<div class="arrow-pointer" id="arrow">👆</div>

<div class="container">
    <h1>Opening Skedulo App</h1>

    <div class="spinner"></div>

    <div class="message">
        We're trying to open your Skedulo agenda automatically.
    </div>

    <a href="skedulox://agenda" class="open-btn">
        Open Skedulo App
    </a>

    <div id="teams-warning" class="teams-warning">
        <strong>One More Step!</strong><br><br>
        If viewing in Microsoft Teams, tap the ↗ icon in the top-right corner to open in your browser first.
    </div>

    <div class="tagline">
        Good people doing great things.
    </div>
</div>

<script>
function isInTeams() {
    if (navigator.userAgent.includes('Teams/')) return true;
    if (window.self !== window.top) return true;
    if (window.nativeInterface || window.microsoftTeams) return true;
    if (window.location.href.includes('teams.microsoft.com')) return true;
    return false;
}

if (isInTeams()) {
    document.getElementById('teams-warning').style.display = 'block';
} else {
    setTimeout(function() {
        window.location.href = "skedulox://agenda";
    }, 1000);
}

setTimeout(function() {
    const warning = document.getElementById('teams-warning');
    if (warning.style.display === 'none') {
        warning.innerHTML = '<strong>Link not working?</strong><br><br>Tap the icon in the top-right corner and open this page in Chrome or Safari.';
        warning.style.display = 'block';
    }
}, 3000);
</script>

</body>
</html>
