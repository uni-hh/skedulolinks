<!DOCTYPE html>
<html>
<head>
    <title>Open Skedulo Mobile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3eef9;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(75,46,131,0.12);
            border-top: 6px solid #4B2E83;
        }

        h1 {
            color: #4B2E83;
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 2rem;
        }

        .instruction {
            color: #333;
            font-size: 1.25rem;
            line-height: 1.45;
            margin: 20px 0;
        }

        .instruction strong {
            color: #4B2E83;
        }

        .icon-callout {
            background: #f5f0ff;
            border: 1px solid #d7c8f5;
            border-radius: 16px;
            padding: 20px;
            margin: 24px 0;
            color: #4B2E83;
            font-size: 1.1rem;
            line-height: 1.45;
        }

        .icon-large {
            font-size: 2rem;
            display: block;
            margin-bottom: 8px;
        }

        .tagline {
            color: #666;
            font-size: 0.95rem;
            margin-top: 18px;
        }

        .arrow-pointer {
            position: fixed;
            top: 20px;
            right: 25px;
            font-size: 44px;
            animation: bounce 1.5s infinite;
            z-index: 9999;
        }

        @keyframes bounce {
            0%,20%,50%,80%,100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        @media (max-width: 480px) {
            .container {
                padding: 40px 25px;
                border-radius: 20px;
            }

            h1 {
                font-size: 1.65rem;
            }

            .instruction {
                font-size: 1.1rem;
            }

            .arrow-pointer {
                top: 14px;
                right: 18px;
                font-size: 38px;
            }
        }
    </style>
</head>
<body>

<div class="arrow-pointer">👆</div>

<div class="container">
    <h1>Open Skedulo Mobile</h1>

    <div class="instruction">
        Tap the <strong>↗ icon in the top-right corner</strong> to open this page externally.
    </div>

    <div class="icon-callout">
        <span class="icon-large">👆</span>
        Once opened externally, Skedulo Mobile will launch.
    </div>

    <div class="tagline">
        Good people doing great things.
    </div>
</div>

<script>
// The Skedulo app can only be launched once this page is opened externally
// from Microsoft Teams / SharePoint mobile webview.

function isLikelyExternalBrowser() {
    if (navigator.userAgent.includes('Teams/')) return false;
    if (window.self !== window.top) return false;
    if (window.nativeInterface || window.microsoftTeams) return false;
    if (window.location.href.includes('teams.microsoft.com')) return false;
    return true;
}

if (isLikelyExternalBrowser()) {
    setTimeout(function() {
        window.location.href = "skedulox://agenda";
    }, 500);
}
</script>

</body>
</html>
