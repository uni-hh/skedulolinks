<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Skedulo Plus</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3eef9;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.container {
    background: white;
    max-width: 520px;
    width: 100%;
    border-radius: 24px;
    border-top: 6px solid #4B2E83;
    padding: 50px 35px;
    text-align: center;
    box-shadow: 0 12px 30px rgba(75,46,131,0.12);
}

.arrow-pointer {
    position: fixed;
    top: 20px;
    right: 25px;
    font-size: 44px;
    animation: bounce 1.5s infinite;
    z-index: 9999;
}

@keyframes bounce {
    0%,20%,50%,80%,100% { transform: translateY(0); }
    40% { transform: translateY(-10px); }
    60% { transform: translateY(-5px); }
}

.finger {
    font-size: 60px;
    margin-bottom: 15px;
}

.title {
    font-size: 2.2rem;
    font-weight: bold;
    color: #4B2E83;
    line-height: 1.25;
    margin-bottom: 15px;
}

.subtitle {
    color: #666;
    font-size: 1.2rem;
    line-height: 1.5;
    margin-bottom: 35px;
}

.divider {
    height: 1px;
    background: #e6ddf7;
    margin: 35px 0;
}

.download-title {
    color: #4B2E83;
    font-size: 1.6rem;
    font-weight: bold;
    margin-bottom: 10px;
}

.download-subtitle {
    color: #666;
    font-size: 1.05rem;
    margin-bottom: 25px;
}

.store-buttons {
    display: flex;
    flex-direction: column;
    gap: 15px;
    align-items: center;
}

.store-badge {
    display: inline-block;
    background: #000;
    color: white;
    text-decoration: none;
    border-radius: 10px;
    padding: 14px 22px;
    min-width: 260px;
    text-align: center;
    font-size: 1rem;
    font-weight: bold;
}

.store-badge small {
    display: block;
    font-size: 0.75rem;
    opacity: 0.8;
}

@media (max-width: 480px) {
    .title {
        font-size: 1.8rem;
    }

    .subtitle {
        font-size: 1.05rem;
    }

    .arrow-pointer {
        font-size: 38px;
        top: 14px;
        right: 18px;
    }
}
</style>
</head>

<body>

<div class="arrow-pointer">👆</div>

<div class="container">

    <div class="finger">👆</div>

    <div class="title">
        Tap the ↗ icon<br>
        in the top-right corner
    </div>

    <div class="subtitle">
        to open Skedulo Plus
    </div>

    <div class="divider"></div>

    <div class="download-title">
        Don't have Skedulo Plus installed?
    </div>

    <div class="download-subtitle">
        Download the app below.
    </div>

    <div class="store-buttons">

        <a class="store-badge"
           href="https://apps.apple.com/au/app/skedulo-plus/id1587076668"
           target="_blank">
            <small>Download on the</small>
            App Store
        </a>

        <a class="store-badge"
           href="https://play.google.com/store/apps/details?id=com.skedulo.app.v3&hl=en_AU"
           target="_blank">
            <small>GET IT ON</small>
            Google Play
        </a>

    </div>

</div>

<script>
function isLikelyExternalBrowser() {
    if (navigator.userAgent.includes('Teams/')) return false;
    if (window.self !== window.top) return false;
    if (window.nativeInterface || window.microsoftTeams) return false;
    if (window.location.href.includes('teams.microsoft.com')) return false;
    return true;
}

if (isLikelyExternalBrowser()) {
    setTimeout(function() {
        window.location.href = "skedulox://agenda";
    }, 500);
}
</script>

</body>
</html>
