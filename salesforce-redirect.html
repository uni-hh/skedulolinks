<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opening Salesforce</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3eef9;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.container {
    background: #ffffff;
    max-width: 700px;
    width: 100%;
    border-radius: 24px;
    padding: 60px 40px;
    text-align: center;
    box-shadow: 0 12px 30px rgba(75,46,131,0.12);
}

.title {
    font-size: 4rem;
    font-weight: 700;
    color: #5B0F75;
    margin: 0;
    line-height: 1.1;
}

.gold-divider {
    width: 140px;
    height: 4px;
    background: #E6B325;
    border-radius: 2px;
    margin: 28px auto 35px auto;
}

.status {
    color: #2F3A4A;
    font-size: 1.35rem;
    line-height: 1.5;
    margin-bottom: 35px;
}

.button {
    display: inline-block;
    background: #5B0F75;
    color: white;
    text-decoration: none;
    border-radius: 16px;
    padding: 20px 30px;
    min-width: 420px;
    text-align: center;
    font-size: 1.25rem;
    font-weight: 600;
    box-shadow: 0 6px 14px rgba(91,15,117,0.25);
    transition: all 0.2s ease;
    margin: 10px 0;
}

.button:hover {
    background: #4A0C5E;
    transform: translateY(-2px);
}

.fallback {
    display: none;
    margin-top: 20px;
}

.fallback-title {
    color: #5B0F75;
    font-size: 1.4rem;
    font-weight: 600;
    margin-bottom: 15px;
}

@media (max-width: 768px) {
    .container {
        padding: 40px 25px;
    }

    .title {
        font-size: 2.8rem;
    }

    .status {
        font-size: 1.1rem;
    }

    .button {
        min-width: 100%;
        box-sizing: border-box;
        font-size: 1.1rem;
        padding: 18px 20px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1 class="title">
        Salesforce
    </h1>

    <div class="gold-divider"></div>

    <div id="status" class="status">
        Detecting your device and opening the right Salesforce link...
    </div>

    <div id="fallback" class="fallback">
        <div class="fallback-title">
            If nothing opens automatically, choose an option below.
        </div>

        <a class="button"
           href="https://unissondisability.lightning.force.com/lightning/page/home">
            Open Salesforce Desktop
        </a>

        <a class="button"
           href="https://apps.apple.com/au/app/salesforce/id404249815">
            Open App Store
        </a>

        <a class="button"
           href="https://play.google.com/store/apps/details?id=com.salesforce.chatter&hl=en_AU">
            Open Google Play Store
        </a>
    </div>

</div>

<script>
(function () {
    const desktopUrl = "https://unissondisability.lightning.force.com/lightning/page/home";
    const iosUrl = "https://apps.apple.com/au/app/salesforce/id404249815";
    const androidUrl = "https://play.google.com/store/apps/details?id=com.salesforce.chatter&hl=en_AU";

    const ua = navigator.userAgent || "";
    const platform = navigator.platform || "";
    const maxTouchPoints = navigator.maxTouchPoints || 0;

    const isIOS =
        /iPhone|iPad|iPod/i.test(ua) ||
        (platform === "MacIntel" && maxTouchPoints > 1);

    const isAndroid = /Android/i.test(ua);

    let targetUrl = desktopUrl;
    let message = "Opening Salesforce in your desktop browser...";

    if (isIOS) {
        targetUrl = iosUrl;
        message = "Opening Salesforce in the App Store...";
    } else if (isAndroid) {
        targetUrl = androidUrl;
        message = "Opening Salesforce in Google Play Store...";
    }

    document.getElementById("status").textContent = message;

    setTimeout(function () {
        window.location.href = targetUrl;
    }, 500);

    setTimeout(function () {
        document.getElementById("fallback").style.display = "block";
    }, 2500);
})();
</script>

</body>
</html>
