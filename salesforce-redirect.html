<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Salesforce Mobile</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3eef9;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.container {
    background: #ffffff;
    max-width: 520px;
    width: 100%;
    border-radius: 24px;
    border-top: 6px solid #4B2E83;
    padding: 45px 32px;
    text-align: center;
    box-shadow: 0 12px 30px rgba(75,46,131,0.12);
}

.arrow-pointer {
    position: fixed;
    top: 20px;
    right: 25px;
    font-size: 44px;
    animation: bounce 1.5s infinite;
    z-index: 9999;
}

@keyframes bounce {
    0%,20%,50%,80%,100% { transform: translateY(0); }
    40% { transform: translateY(-10px); }
    60% { transform: translateY(-5px); }
}

.finger {
    font-size: 58px;
    margin-bottom: 15px;
}

.title {
    font-size: 2rem;
    font-weight: bold;
    color: #4B2E83;
    line-height: 1.25;
    margin-bottom: 14px;
}

.subtitle {
    color: #555;
    font-size: 1.15rem;
    line-height: 1.45;
    margin-bottom: 28px;
}

.button {
    display: block;
    background: #4B2E83;
    color: white;
    text-decoration: none;
    padding: 16px 26px;
    border-radius: 28px;
    font-weight: bold;
    margin: 14px auto;
    max-width: 280px;
    box-shadow: 0 6px 14px rgba(75,46,131,0.22);
}

.button.secondary {
    background: white;
    color: #4B2E83;
    border: 2px solid #4B2E83;
    box-shadow: none;
}

.note {
    color: #666;
    font-size: 0.95rem;
    margin-top: 25px;
}

@media (max-width: 480px) {
    .container {
        padding: 42px 26px;
    }

    .title {
        font-size: 1.75rem;
    }

    .subtitle {
        font-size: 1.05rem;
    }

    .arrow-pointer {
        font-size: 38px;
        top: 14px;
        right: 18px;
    }
}
</style>
</head>

<body>

<div class="arrow-pointer">👆</div>

<div class="container">

    <div class="finger">👆</div>

    <div class="title">
        Tap the ↗ icon<br>
        in the top-right corner
    </div>

    <div class="subtitle">
        After opening externally,<br>
        tap one of the buttons below.
    </div>

    <a class="button" href="salesforce1://">
        Open Salesforce Mobile
    </a>

    <a class="button secondary"
       href="https://unissondisability.lightning.force.com/lightning/n/DSP_Mobile_Home">
        Open DSP Mobile Home
    </a>

    <div class="note">
        If one option doesn't work, try the other.
    </div>

</div>

</body>
</html>
