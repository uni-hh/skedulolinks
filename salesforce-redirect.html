<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salesforce</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3eef9;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.container {
    background: #ffffff;
    max-width: 700px;
    width: 100%;
    border-radius: 24px;
    padding: 60px 40px;
    text-align: center;
    box-shadow: 0 12px 30px rgba(75,46,131,0.12);
}

.title {
    font-size: 4rem;
    font-weight: 700;
    color: #5B0F75;
    margin: 0;
    line-height: 1.1;
}

.gold-divider {
    width: 140px;
    height: 4px;
    background: #E6B325;
    border-radius: 2px;
    margin: 28px auto 35px auto;
}

.section-title {
    font-size: 1.8rem;
    font-weight: 600;
    color: #5B0F75;
    margin-bottom: 10px;
}

.section-text {
    color: #2F3A4A;
    font-size: 1.15rem;
    line-height: 1.5;
    margin-bottom: 25px;
}

.button {
    display: inline-block;
    background: #5B0F75;
    color: white;
    text-decoration: none;
    border-radius: 16px;
    padding: 20px 30px;
    min-width: 420px;
    text-align: center;
    font-size: 1.25rem;
    font-weight: 600;
    box-shadow: 0 6px 14px rgba(91,15,117,0.25);
    transition: all 0.2s ease;
}

.button:hover {
    background: #4A0C5E;
    transform: translateY(-2px);
}

.divider {
    height: 1px;
    background: #E6DDF7;
    margin: 45px 0;
}

.store-buttons {
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
}

@media (max-width: 768px) {

    .container {
        padding: 40px 25px;
    }

    .title {
        font-size: 2.8rem;
    }

    .button {
        min-width: 100%;
        box-sizing: border-box;
        font-size: 1.1rem;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1 class="title">
        Salesforce
    </h1>

    <div class="gold-divider"></div>

    <!-- Desktop Section -->

    <div class="section-title">
        Salesforce Desktop
    </div>

    <div class="section-text">
        Access Salesforce using your desktop web browser.
    </div>

    <a class="button"
       href="https://unissondisability.lightning.force.com/lightning/page/home"
       target="_blank">
        Open Desktop Browser
    </a>

    <div class="divider"></div>

    <!-- Mobile Section -->

    <div class="section-title">
        Salesforce Mobile
    </div>

    <div class="section-text">
        Open or download Salesforce Mobile using one of the links below.
    </div>

    <div class="store-buttons">

        <a class="button"
           href="https://apps.apple.com/au/app/salesforce/id404249815"
           target="_blank">
            Open App Store
        </a>

        <a class="button"
           href="https://play.google.com/store/apps/details?id=com.salesforce.chatter&hl=en_AU"
           target="_blank">
            Open Google Play Store
        </a>

    </div>

</div>

</body>
</html>
